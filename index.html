<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конструкция скважины</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3aa7cf">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, Roboto, Arial, sans-serif; background: #eef6fb; color: #0b2a3a; }
    body { min-height: 100vh; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .btn { border: 0; border-radius: 10px; padding: 14px 18px; font-size: 18px; background: #bfe3f2; color: #0b2a3a; }
    .btn.primary { background: #3aa7cf; font-weight: 700; }
    .btn.secondary { background: #dfeaed; }
    .btn.active { outline: 4px solid #0b2a3a; }
    .title { background: #3aa7cf; border-radius: 14px; padding: 18px; text-align: center; font-size: 28px; font-weight: 700; }

    .login {
      max-width: 460px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 14px;
      min-height: 100vh; justify-content: center;
    }
    .login p { margin: 0; font-size: 17px; color: #27465a; }
    .login input {
      font-size: 20px; padding: 14px; border: 2px solid #9ec9dc; border-radius: 10px; width: 100%;
      background: white;
    }
    .login .row { display: flex; gap: 12px; }
    .login .row .btn { flex: 1; }
    .login .mode-toggle { display: flex; gap: 8px; }
    .login .mode-toggle button { flex: 1; }
    .login .mode-toggle .btn.active { background: #3aa7cf; color: white; }
    .error { color: #c0392b; min-height: 22px; font-size: 16px; }
    .small { font-size: 14px; color: #3c5b6d; }

    .main { display: grid; grid-template-columns: 250px 1fr 380px; gap: 16px; padding: 16px; min-height: 100vh; }
    .parts { display: flex; flex-direction: column; gap: 8px; }
    .part { flex: 1; display: flex; align-items: center; justify-content: space-between; text-align: left; padding: 8px 12px; border: 1px solid #3aa7cf; border-radius: 8px; background: #bfe3f2; font-size: 16px; }
    .part.sel { background: #3aa7cf; font-weight: 700; }
    .dot { width: 18px; height: 18px; border-radius: 50%; flex: none; margin-left: 8px; }
    .well { min-height: 0; background: #fff; border-radius: 10px; overflow: hidden; }
    .well svg { width: 100%; height: 100%; display: block; }
    .info { display: flex; flex-direction: column; gap: 12px; }
    .info h2 { margin: 0; font-size: 30px; }
    .info p { margin: 0; font-size: 19px; color: #27465a; line-height: 1.4; }
    .info .ask { font-weight: 700; color: #0b2a3a; margin-top: 8px; }
    .spacer { flex: 1; }
    .presence {
      background: #f6fbff; border: 1px solid #aed6ea; border-radius: 12px;
      padding: 12px; color: #173d51; line-height: 1.5; font-size: 16px;
    }
    .presence h3 { margin: 0 0 8px; font-size: 19px; }
    .presence ul { margin: 0; padding-left: 18px; }

    .results { padding: 24px; max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .results h2 { margin: 0; font-size: 26px; }
    .rrow { display: flex; align-items: center; gap: 12px; }
    .rname { width: 260px; font-size: 19px; }
    .bar { flex: 1; height: 34px; border-radius: 6px; background: #dfe7ec; display: flex; overflow: hidden; }
    .nums { width: 130px; font-size: 18px; color: #27465a; }
    .answers-list { font-size: 14px; color: #28506d; padding-left: 276px; }
    .answers-list span { display: inline-block; margin-right: 8px; margin-bottom: 4px; }

    @media (max-width: 950px) {
      .main { grid-template-columns: 1fr; min-height: auto; }
      .parts { flex-direction: row; flex-wrap: wrap; }
      .part { flex: 1 1 45%; min-height: 52px; }
      .well { height: 520px; }
      .rname { width: 130px; font-size: 16px; }
      .nums { width: 90px; }
      .answers-list { padding-left: 0; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const PARTS = [
      { id: 'mouth', name: 'Устье', text: 'Верхняя часть скважины, выход на поверхность. Здесь стоит арматура: она закрывает сверху скважину.', rects: [[0.16, 0.04, 0.68, 0.10]] },
      { id: 'direction', name: 'Направление', text: 'Самая короткая и самая широкая труба. Закрепляет верхний рыхлый слой грунта.', rects: [[0.16, 0.18, 0.70, 0.12]] },
      { id: 'conductor', name: 'Кондуктор', text: 'Вторая колонна труб. Перекрывает верхние слои и пресные водоносные горизонты.', rects: [[0.12, 0.33, 0.76, 0.14]] },
      { id: 'casing', name: 'Обсадная колонна', text: 'Стальные трубы, которыми крепят скважину. Их заливают цементом.', rects: [[0.10, 0.50, 0.82, 0.12]] },
      { id: 'walls', name: 'Стенки скважины', text: 'Сама порода, которую пробурили. Без труб и цемента стенки обваливаются.', rects: [[0.12, 0.68, 0.76, 0.14]] },
      { id: 'production', name: 'Эксплуатационная колонна', text: 'Последняя, самая узкая колонна. По ней нефть поднимается на поверхность.', rects: [[0.24, 0.83, 0.52, 0.08]] },
      { id: 'bottom', name: 'Забой', text: 'Дно скважины, самая нижняя точка, до которой дошло бурение.', rects: [[0.36, 0.90, 0.28, 0.03]] }
    ];

    const LEVELS = [
      { name: 'Плохо понял', color: '#d64545' },
      { name: 'Понял частично', color: '#e0a526' },
      { name: 'Понял', color: '#3aa655' }
    ];

    const PRESENCE_TTL = 30000;
    const useSupabase = !!(window.APP_CONFIG && window.APP_CONFIG.supabaseUrl && window.APP_CONFIG.supabaseAnonKey);
    const supabase = useSupabase ? window.supabase.createClient(window.APP_CONFIG.supabaseUrl, window.APP_CONFIG.supabaseAnonKey) : null;

    let user = loadLocal('oil_user', null);
    let screen = 'well';
    let selected = 0;
    let authMode = 'login';
    let authError = '';
    let presenceChannel = null;
    let currentAnswers = {};
    let allAnswers = [];

    function loadLocal(key, fallback) {
      try {
        const v = JSON.parse(localStorage.getItem(key));
        return v === null ? fallback : v;
      } catch (e) {
        return fallback;
      }
    }

    function saveLocal(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function getCurrentUserName() {
      if (!user) return 'Студент';
      return (user.name || user.email || 'Студент').trim() || 'Студент';
    }

    function myDrops() {
      return currentAnswers || {};
    }

    function showError(msg) {
      authError = msg;
      render();
    }

    function setLevel(level) {
      if (!user) return;
      const partId = PARTS[selected].id;

      if (supabase) {
        const payload = {
          student_id: user.id,
          student_name: user.name || user.email.split('@')[0],
          part_id: partId,
          level: Number(level),
          updated_at: new Date().toISOString()
        };

        supabase.from('answers').upsert(payload, { onConflict: 'student_id,part_id' }).then(({ error }) => {
          if (error) console.error(error);
          else {
            currentAnswers[partId] = Number(level);
            refreshAllAnswers();
            render();
          }
        });
        return;
      }

      const answers = loadLocal('oil_answers', {});
      const person = answers[user.id] || { name: user.name || user.email || 'Студент', answers: {} };
      person.answers[partId] = Number(level);
      answers[user.id] = person;
      saveLocal('oil_answers', answers);
      currentAnswers = person.answers;
      refreshAllAnswers();
      render();
    }

    function getLocalPresenceMap() {
      const map = loadLocal('oil_presence', {});
      const now = Date.now();
      for (const key in map) {
        if (now - (map[key].seenAt || 0) > PRESENCE_TTL) delete map[key];
      }
      saveLocal('oil_presence', map);
      return map;
    }

    function updateLocalPresence() {
      const map = getLocalPresenceMap();
      map[user.id] = { name: getCurrentUserName(), seenAt: Date.now() };
      saveLocal('oil_presence', map);
      if (presenceChannel) presenceChannel.postMessage({ name: getCurrentUserName(), seenAt: Date.now() });
    }

    async function syncProfile() {
      if (!supabase || !user) return;
      const payload = {
        id: user.id,
        name: user.name || user.email.split('@')[0],
        email: user.email,
        last_seen: new Date().toISOString()
      };
      const { error } = await supabase.from('profiles').upsert(payload, { onConflict: 'id' });
      if (error) console.error(error);
    }

    async function refreshCurrentAnswers() {
      if (!user) {
        currentAnswers = {};
        return;
      }

      if (supabase) {
        const { data, error } = await supabase.from('answers').select('part_id, level').eq('student_id', user.id);
        if (!error) {
          currentAnswers = {};
          (data || []).forEach(row => {
            currentAnswers[row.part_id] = Number(row.level);
          });
        }
        return;
      }

      const all = loadLocal('oil_answers', {});
      currentAnswers = (all[user.id] && all[user.id].answers) || {};
    }

    async function refreshAllAnswers() {
      if (!supabase) {
        const all = loadLocal('oil_answers', {});
        const list = [];
        Object.keys(all).forEach(studentId => {
          const student = all[studentId];
          Object.keys(student.answers || {}).forEach(partId => {
            list.push({ student_id: studentId, student_name: student.name || 'Студент', part_id: partId, level: Number(student.answers[partId]) });
          });
        });
        allAnswers = list;
        return;
      }

      const { data, error } = await supabase.from('answers').select('student_id, student_name, part_id, level, updated_at').order('updated_at', { ascending: false });
      allAnswers = !error ? (data || []) : [];
    }

    async function updatePresence() {
      if (!user) return;
      if (supabase) {
        await syncProfile();
      } else {
        updateLocalPresence();
      }
      await renderOnlineUsers();
    }

    async function getPresenceUsers() {
      if (supabase) {
        const cutoff = new Date(Date.now() - PRESENCE_TTL).toISOString();
        const { data, error } = await supabase.from('profiles').select('name,last_seen').gt('last_seen', cutoff).order('last_seen', { ascending: false });
        if (error) return [];
        return data.map(r => r.name || 'Студент');
      }
      return Object.values(getLocalPresenceMap()).map(u => u.name).sort((a, b) => a.localeCompare(b));
    }

    async function renderOnlineUsers() {
      const users = await getPresenceUsers();
      const list = users.length ? users.map(name => `<li>${esc(name)}</li>`).join('') : '<li>Никого</li>';
      const el = document.getElementById('onlineList');
      if (el) el.innerHTML = `<div class="presence"><h3>Кто сейчас в комнате:</h3><ul>${list}</ul></div>`;
    }

    function subscribePresence() {
      if (!supabase) {
        if ('BroadcastChannel' in window) {
          presenceChannel = new BroadcastChannel('oil_presence_channel');
          presenceChannel.onmessage = () => renderOnlineUsers();
        }
        window.addEventListener('storage', (event) => {
          if (event.key === 'oil_presence') renderOnlineUsers();
        });
        return;
      }

      if (!window.__classroomChannel) {
        const channel = supabase.channel('classroom-room');
        channel.on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => { renderOnlineUsers(); });
        channel.on('postgres_changes', { event: '*', schema: 'public', table: 'answers' }, () => { refreshAllAnswers(); render(); });
        channel.subscribe();
        window.__classroomChannel = channel;
      }
    }

    async function loginWithEmail(mode) {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const name = document.getElementById('name') ? document.getElementById('name').value.trim() : '';

      if (!email || !password) {
        showError('Введите email и пароль');
        return;
      }

      if (mode === 'register' && !name) {
        showError('Для регистрации укажите имя');
        return;
      }

      try {
        if (!supabase) {
          user = {
            id: `local-${Date.now()}`,
            name: name || email.split('@')[0],
            email
          };
          saveLocal('oil_user', user);
          currentAnswers = {};
          screen = 'well';
          render();
          return;
        }

        if (mode === 'register') {
          const { data, error } = await supabase.auth.signUp({
            email,
            password,
            options: { data: { name } }
          });

          if (error) throw error;

          if (data?.user) {
            user = {
              id: data.user.id,
              name: name || data.user.email.split('@')[0],
              email: data.user.email
            };
            await syncProfile();
            authError = 'Регистрация успешна. Теперь вы можете войти в систему.';
            authMode = 'login';
            render();
            return;
          }

          showError('Регистрация создана, проверьте доступ к аккаунту.');
          return;
        }

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const authUser = data?.user;
        if (!authUser) throw new Error('Пользователь не найден');

        user = {
          id: authUser.id,
          name: authUser.user_metadata?.name || name || authUser.email.split('@')[0],
          email: authUser.email
        };
        await syncProfile();
        await refreshCurrentAnswers();
        await refreshAllAnswers();
        screen = 'well';
        render();
      } catch (e) {
        showError(e.message || 'Ошибка авторизации');
      }
    }

    async function logout() {
      if (supabase) {
        await supabase.auth.signOut();
      }
      user = null;
      saveLocal('oil_user', null);
      currentAnswers = {};
      screen = 'well';
      render();
    }

    function selectPart(i) {
      selected = i;
      render();
    }

    function go(s) {
      screen = s;
      render();
    }

    function renderLogin() {
      const showName = authMode === 'register';
      return `
        <div class="login">
          <div class="title">Конструкция скважины</div>
          <p>Войдите по email, чтобы видеть всех участников и результаты в реальном времени.</p>

          <div class="mode-toggle">
            <button class="btn ${authMode === 'login' ? 'active primary' : 'secondary'}" onclick="authMode='login'; authError=''; render();">Вход</button>
            <button class="btn ${authMode === 'register' ? 'active primary' : 'secondary'}" onclick="authMode='register'; authError=''; render();">Регистрация</button>
          </div>

          ${showName ? '<input id="name" type="text" placeholder="Имя студента" autocomplete="name">' : ''}
          <input id="email" type="email" placeholder="Email" autocomplete="email" />
          <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" />

          <div class="error">${esc(authError || '')}</div>
          <div class="row">
            <button class="btn primary" onclick="loginWithEmail('${authMode}')">${authMode === 'register' ? 'Зарегистрироваться' : 'Войти'}</button>
          </div>
          <div class="small">Если Supabase настроен, все ответы и присутствие синхронизируются между планшетами.</div>
        </div>`;
    }

    function renderWellSvg(drops) {
      const W = 400, H = 640;
      let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8a6e4b"/><stop offset="0.35" stop-color="#c9a97a"/>
            <stop offset="0.7" stop-color="#e7d6b8"/><stop offset="1" stop-color="#f4ecd9"/>
          </linearGradient>
        </defs>
        <rect width="${W}" height="${H}" fill="url(#ground)"/>`;

      PARTS.forEach((p, i) => {
        const fill = i === selected ? '#3aa7cf' : '#f5f5f5';
        p.rects.forEach(r => {
          s += `<rect x="${r[0] * W}" y="${r[1] * H}" width="${r[2] * W}" height="${r[3] * H}"
                  fill="${fill}" stroke="#6b7b86" onclick="selectPart(${i})" style="cursor:pointer"/>`;
        });
      });

      PARTS.forEach(p => {
        const lvl = drops[p.id];
        if (lvl === undefined) return;
        const cy = (p.rects[0][1] + p.rects[0][3] / 2) * H;
        s += `<g transform="translate(${W * 0.82},${cy})">
                <path d="M0,-20 C16,2 14,18 0,18 C-14,18 -16,2 0,-20 Z" fill="#1c1c1c" stroke="${LEVELS[lvl].color}" stroke-width="4"/>
              </g>`;
      });

      return s + '</svg>';
    }

    function renderWell() {
      const drops = myDrops();
      const p = PARTS[selected];
      const partBtns = PARTS.map((q, i) => {
        const d = drops[q.id];
        const dot = d === undefined ? '' : `<span class="dot" style="background:${LEVELS[d].color}"></span>`;
        return `<button class="part ${i === selected ? 'sel' : ''}" onclick="selectPart(${i})"><span>${esc(q.name)}</span>${dot}</button>`;
      }).join('');

      const levelBtns = [2, 1, 0].map(l =>
        `<button class="btn ${drops[p.id] === l ? 'active' : ''}" onclick="setLevel(${l})">● ${LEVELS[l].name}</button>`).join('');

      return `
        <div class="main">
          <div class="parts">${partBtns}</div>
          <div class="well">${renderWellSvg(drops)}</div>
          <div class="info">
            <h2>${esc(p.name)}</h2>
            <p>${esc(p.text)}</p>
            <p class="ask">Как ты понял эту часть? Поставь каплю:</p>
            ${levelBtns}
            <div class="spacer"></div>
            <div id="onlineList"></div>
            <button class="btn" onclick="go('results')">Результаты группы</button>
            <button class="btn" onclick="logout()">Выйти (${esc(getCurrentUserName())})</button>
          </div>
        </div>`;
    }

    function renderResults() {
      const countsByPart = {};
      PARTS.forEach(part => {
        countsByPart[part.id] = [0, 0, 0];
      });

      allAnswers.forEach(row => {
        const part = row.part_id;
        if (countsByPart[part]) countsByPart[part][Number(row.level)] += 1;
      });

      const rows = PARTS.map(part => {
        const c = countsByPart[part.id];
        const total = Math.max(1, c[0] + c[1] + c[2]);
        const seg = (n, color) => `<div style="width:${n / total * 100}%;background:${color}"></div>`;
        const people = allAnswers.filter(r => r.part_id === part.id);
        const peopleList = people.length ? people.map(r => `<span>${esc(r.student_name || 'Студент')}: ${esc(LEVELS[Number(r.level)].name)}</span>`).join('') : '<span>Пока никто не ответил</span>';

        return `
          <div class="rrow"><div class="rname">${esc(part.name)}</div><div class="bar">${seg(c[0], LEVELS[0].color)}${seg(c[1], LEVELS[1].color)}${seg(c[2], LEVELS[2].color)}</div><div class="nums">${c[2]} / ${total}</div></div>
          <div class="answers-list">${peopleList}</div>
        `;
      }).join('');

      return `
        <div class="results">
          <h2>Результаты группы</h2>
          <p>Красный: плохо понял, жёлтый: частично, зелёный: понял.</p>
          ${rows}
          <div id="onlineList"></div>
          <button class="btn primary" style="align-self:flex-start" onclick="go('well')">Назад к схеме</button>
        </div>`;
    }

    async function render() {
      const app = document.getElementById('app');
      if (!user) {
        app.innerHTML = renderLogin();
        return;
      }

      if (screen === 'results') {
        await refreshAllAnswers();
        app.innerHTML = renderResults();
      } else {
        await refreshCurrentAnswers();
        app.innerHTML = renderWell();
      }

      await renderOnlineUsers();
    }

    async function initApp() {
      if (supabase) {
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) {
          user = {
            id: session.user.id,
            name: session.user.user_metadata?.name || session.user.email?.split('@')[0] || 'Студент',
            email: session.user.email
          };
          await syncProfile();
          await refreshCurrentAnswers();
          await refreshAllAnswers();
        }
      } else {
        const savedUser = loadLocal('oil_user', null);
        if (savedUser) user = savedUser;
      }

      subscribePresence();
      render();
      setInterval(() => {
        if (user) updatePresence();
      }, 15000);
    }

    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    initApp();
  </script>
</body>
</html>
